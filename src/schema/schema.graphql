type Person {
  id: ID!
  givenName: String!
  familyName: String!
  label: String!
  gender: Gender
  dateOfBirth: String
  dateOfDeath: String
  birthLocation: String
  deathLocation: String
  notes: String
  createdBy: String
  createdAt: String
}

enum Gender {
  MALE
  FEMALE
  OTHER
}

type User {
  id: ID!
  email: String!
  createdAt: String!
}

type Query {
  persons: [Person]
}
